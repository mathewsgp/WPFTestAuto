syntax = "proto3";

option csharp_namespace = "WpfSpyAgent.Grpc";

package wpfspy;

// ALTERNATE IPC TRANSPORT (optional, not wired into the default build).
// The default, fully-implemented transport is Named Pipes — see
// WpfSpyAgent/SpyAgentHost.cs and docs/PROTOCOL.md. This contract exists
// for teams that prefer gRPC (e.g. cross-machine test execution rather
// than same-host IPC, or organizational standardization on gRPC).
// Semantics are identical to the Named Pipe JSON protocol; this is just
// a different wire format for the same six commands.
service SpyAgent {
  rpc Find (ElementRequest) returns (Result);
  rpc Invoke (ElementRequest) returns (Result);
  rpc SetValue (SetValueRequest) returns (Result);
  rpc GetText (ElementRequest) returns (TextResult);
  rpc IsVisible (ElementRequest) returns (BoolResult);
  rpc Toggle (ElementRequest) returns (Result);
}

message ElementRequest {
  string name = 1;
}

message SetValueRequest {
  string name = 1;
  string value = 2;
}

message Result {
  bool success = 1;
  string error = 2;
}

message TextResult {
  bool success = 1;
  string error = 2;
  string text = 3;
}

message BoolResult {
  bool success = 1;
  string error = 2;
  bool value = 3;
}
