# Element Repository — Login Page
#
# Hierarchical Element Format with parentAlias
# ============================================
#
# Each element specifies:
# - parentAlias: Parent element alias (or null for root/Window)
# - relativeXPath: XPath relative to parent element
# - strategies: Per-driver strategies with priority
#
# Structure:
# LoginPage.MainWindow (parentAlias: null, window element)
# └── LoginPage.LoginForm (optional GroupBox if present)
#     ├── LoginPage.txtUsername
#     ├── LoginPage.txtPassword
#     ├── LoginPage.btnSubmit
#     └── LoginPage.lblError
#
# NOTE: Controls directly under Window (no GroupBox) have relativeXPath from Window.
#
elements:
  # Root window - parent is null (this is the top-level element)
  LoginPage.MainWindow:
    displayName: "Main Window"
    controlType: "Window"
    windowAutomationId: "MainWindow"
    parentAlias: null  # This is the root
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "MainWindow"
          priority: 1

  # Username TextBox - parent is MainWindow (direct child of Window)
  LoginPage.MainWindow.txtUsername:
    displayName: "Username Text Box"
    controlType: "TextBox"
    automationId: "txtUsername"
    parentAlias: "LoginPage.MainWindow"
    relativeXPath: "TextBox[@AutomationId='txtUsername']"
    defaultTimeout: 10
    tags: ["login", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "txtUsername"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "TextBox[@AutomationId='txtUsername']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "username_box.png"
          priority: 2

  # Password PasswordBox - parent is MainWindow
  LoginPage.MainWindow.txtPassword:
    displayName: "Password Text Box"
    controlType: "PasswordBox"
    automationId: "txtPassword"
    name: "txtPassword"
    parentAlias: "LoginPage.MainWindow"
    relativeXPath: "PasswordBox[@AutomationId='txtPassword']"
    defaultTimeout: 10
    tags: ["login", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "txtPassword"
          priority: 1
        - searchBy: "Name"
          value: "txtPassword"
          priority: 2
      WPFSpy:
        - searchBy: "XPath"
          value: "PasswordBox[@AutomationId='txtPassword']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "password_box.png"
          priority: 2

  # Submit Button - parent is MainWindow
  LoginPage.MainWindow.btnSubmit:
    displayName: "Submit Button"
    controlType: "Button"
    automationId: "btnSubmit"
    parentAlias: "LoginPage.MainWindow"
    relativeXPath: "Button[@AutomationId='btnSubmit']"
    defaultTimeout: 10
    tags: ["login", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "btnSubmit"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "Button[@AutomationId='btnSubmit']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "login_button.png"
          priority: 2

  # Error Label - parent is MainWindow
  LoginPage.MainWindow.lblError:
    displayName: "Error Label"
    controlType: "Label"
    automationId: "lblError"
    parentAlias: "LoginPage.MainWindow"
    relativeXPath: "Label[@AutomationId='lblError']"
    defaultTimeout: 5
    tags: ["login", "verification"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "lblError"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "Label[@AutomationId='lblError']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "error_label.png"
          priority: 2
