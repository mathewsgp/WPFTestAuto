# Element Repository — Login Page
#
# Multi-Strategy Format with Hierarchical Support
# ================================================
#
# Each element defines:
# - containerPath: List of containers from Window to parent
# - strategies: Per-driver strategies with priority
#
# Container Path Format:
#   - type: Container type (TabControl, TabItem, GroupBox, StackPanel, Grid, etc.)
#   - automationId: (optional) AutomationId of container
#   - name: (optional) Name of container
#   - index: (optional) Index among siblings if no unique identifier
#
# Strategy Priority per Level:
#   1. AutomationId (most reliable)
#   2. Name (second choice)
#   3. Type + Index (fallback)
#
# Element Path Priority:
#   1. AutomationId (control's own AutomationId)
#   2. Name (control's own Name)
#   3. Type + Index (sibling position)
#
elements:
  LoginPage.MainWindow.txtUsername:
    displayName: "Username Text Box"
    controlType: "TextBox"
    parentWindow: "MainWindow"
    defaultTimeout: 10
    tags: ["login", "critical"]
    containerPath:
      - {type: "Grid", automationId: null, name: "LoginGrid"}
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "txtUsername"
          priority: 1
        - searchBy: "Name"
          value: "UsernameInput"
          priority: 2
        - searchBy: "TypeAndIndex"
          value: "TextBox[1]"
          priority: 3
        - searchBy: "XPath"
          value: "/Window[@AutomationId='MainWindow']/Grid[@Name='LoginGrid']/TextBox[@AutomationId='txtUsername']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='MainWindow']/Grid[@Name='LoginGrid']/TextBox[@AutomationId='txtUsername']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='MainWindow']/Grid[@Name='LoginGrid']/TextBox[@Name='UsernameInput']"
          priority: 2
        - searchBy: "XPath"
          value: "/Window[@Name='MainWindow']/Grid[@Name='LoginGrid']/TextBox[1]"
          priority: 3
      Sikuli:
        - searchBy: "Image"
          value: "username_box.png"
          priority: 4

