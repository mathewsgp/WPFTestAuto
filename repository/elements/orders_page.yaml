    controlType: "CheckBox"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "non-standard", "no-automationid"]
    hasAutomationId: false
    containerPath:
      - {type: "TabControl", automationId: "MainTabs"}
      - {type: "TabItem", name: "General", index: 0}
      - {type: "GroupBox", automationId: "OrderInfo"}
    strategies:
      # NOTE: No AutomationId strategy - only Name or Type+Index
      FlaUI:
        - searchBy: "Name"
          value: "PriorityToggle"
          priority: 1
        - searchBy: "TypeAndIndex"
          value: "CheckBox[1]"
          priority: 2
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/CheckBox[@Name='PriorityToggle']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/CheckBox[@Name='PriorityToggle']"
