        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='General']/GroupBox[@Name='OrderInfo']/CheckBox[@Name='PriorityToggle']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "priority_checkbox.png"
          priority: 1

