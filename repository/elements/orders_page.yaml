# Element Repository — Orders Page
# Aliases include full ancestor hierarchy with AutomationId or Name.
# XPath is the primary finding strategy with priority: AutomationId -> Name -> Type
# Updated to use Name for mock app compatibility
elements:
  OrdersPage.OrdersWindow.cmbSku:
    displayName: "SKU Combo Box"
    controlType: "ComboBox"
    parentAlias: "OrdersPage.OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      WPFSpy:
        searchBy: "XPath"
        value: "/Window[@Name='MainWindow']/ComboBox[@Name='SkuCombo']"

  OrdersPage.OrdersWindow.txtQty:
    displayName: "Quantity Text Box"
    controlType: "TextBox"
    parentAlias: "OrdersPage.OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      WPFSpy:
        searchBy: "XPath"
        value: "/Window[@Name='MainWindow']/TextBox[@Name='QtyInput']"

  OrdersPage.OrdersWindow.chkPriority:
    displayName: "Priority Checkbox"
    controlType: "PriorityToggleControl"
    parentAlias: "OrdersPage.OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "non-standard"]
    strategies:
      WPFSpy:
        searchBy: "XPath"
        value: "/Window[@Name='MainWindow']/CheckBox[@Name='PriorityToggle']"

  OrdersPage.OrdersWindow.btnCreateOrder:
    displayName: "Create Order Button"
    controlType: "Button"
    parentAlias: "OrdersPage.OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      WPFSpy:
        searchBy: "XPath"
        value: "/Window[@Name='MainWindow']/Button[@Name='CreateOrderBtn']"

  OrdersPage.OrdersWindow.btnLogout:
    displayName: "Logout Button"
    controlType: "Button"
    parentAlias: "OrdersPage.OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "navigation"]
    strategies:
      WPFSpy:
        searchBy: "XPath"
        value: "/Window[@Name='MainWindow']/Button[@Name='LogoutBtn']"

  OrdersPage.OrdersWindow.lblConfirmation:
    displayName: "Confirmation Label"
    controlType: "Label"
    parentAlias: "OrdersPage.OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "verification"]
    strategies:
      WPFSpy:
        searchBy: "XPath"
        value: "/Window[@Name='MainWindow']/Label[@Name='ConfirmationLabel']"

  OrdersPage.OrdersWindow.gridOrders:
    displayName: "Orders Grid"
    controlType: "DataGrid"
    parentAlias: "OrdersPage.OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "verification"]
    strategies:
      WPFSpy:
        searchBy: "XPath"
        value: "/Window[@Name='MainWindow']/DataGrid[@Name='OrdersGrid']"
