      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/Label[@AutomationId='lblConfirmation']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/Label[@Name='ConfirmationLabel']"
          priority: 2
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/Label[1]"
          priority: 3
      Sikuli:
        - searchBy: "Image"
          value: "confirmation_label.png"
          priority: 4

  OrdersPage.OrdersWindow.gridOrders:
    displayName: "Orders Grid"
    controlType: "DataGrid"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "verification"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "gridOrders"
          priority: 1
        - searchBy: "Name"
          value: "OrdersGrid"
          priority: 2
        - searchBy: "TypeAndIndex"
          value: "DataGrid[1]"
          priority: 3
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/DataGrid[@AutomationId='gridOrders']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/DataGrid[@Name='OrdersGrid']"
