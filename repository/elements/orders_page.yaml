# Element Repository — Orders Page
#
# Multi-Strategy Format with Hierarchical Support
# ================================================
#
# IMPORTANT: Only include containers with AutomationId or Name.
# Layout containers (Grid, StackPanel, Panel) WITHOUT identifiers are SKIPPED.
#
# Structure (only identifiable containers shown):
# Window (OrdersWindow)
# └── TabControl (MainTabs)
#     ├── TabItem (General)
#     │   └── GroupBox (OrderInfo)
#     │       ├── ComboBox (cmbSku)
#     │       ├── TextBox (txtQty)
#     │       ├── CheckBox (chkPriority) - NO AutomationId!
#     │       ├── Button (btnCreateOrder)
#     │       └── Label (lblConfirmation)
#     └── TabItem (History)
#         └── DataGrid (gridOrders)
#             └── Button (btnLogout)
#
# NOTE: chkPriority has NO AutomationId - falls back to Name
#
elements:
  OrdersPage.OrdersWindow.cmbSku:
    displayName: "SKU Combo Box"
    controlType: "ComboBox"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "cmbSku"
          priority: 1
        - searchBy: "Name"
          value: "SkuCombo"
          priority: 2
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/ComboBox[@AutomationId='cmbSku']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/ComboBox[@AutomationId='cmbSku']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='General']/GroupBox[@Name='OrderInfo']/ComboBox[@Name='SkuCombo']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "sku_combo.png"
          priority: 3

  OrdersPage.OrdersWindow.txtQty:
    displayName: "Quantity Text Box"
    controlType: "TextBox"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "txtQty"
          priority: 1
        - searchBy: "Name"
          value: "QtyInput"
          priority: 2
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/TextBox[@AutomationId='txtQty']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/TextBox[@AutomationId='txtQty']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='General']/GroupBox[@Name='OrderInfo']/TextBox[@Name='QtyInput']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "qty_box.png"
          priority: 3

  OrdersPage.OrdersWindow.chkPriority:
    displayName: "Priority Checkbox (No AutomationId)"
    controlType: "CheckBox"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "non-standard", "no-automationid"]
    hasAutomationId: false
    strategies:
      # NOTE: No AutomationId - only Name or XPath-based fallback
      FlaUI:
        - searchBy: "Name"
          value: "PriorityToggle"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/CheckBox[@Name='PriorityToggle']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/CheckBox[@Name='PriorityToggle']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='General']/GroupBox[@Name='OrderInfo']/CheckBox[@Name='PriorityToggle']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "priority_checkbox.png"
          priority: 1

  OrdersPage.OrdersWindow.btnCreateOrder:
    displayName: "Create Order Button"
    controlType: "Button"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "btnCreateOrder"
          priority: 1
        - searchBy: "Name"
          value: "CreateOrderBtn"
          priority: 2
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/Button[@AutomationId='btnCreateOrder']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/Button[@AutomationId='btnCreateOrder']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='General']/GroupBox[@Name='OrderInfo']/Button[@Name='CreateOrderBtn']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "create_order_button.png"
          priority: 3

  OrdersPage.OrdersWindow.btnLogout:
    displayName: "Logout Button"
    controlType: "Button"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "navigation"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "btnLogout"
          priority: 1
        - searchBy: "Name"
          value: "LogoutBtn"
          priority: 2
        # Note: DataGrid has no AutomationId, so path ends at TabItem
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='History']/Button[@AutomationId='btnLogout']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='History']/Button[@AutomationId='btnLogout']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='History']/Button[@Name='LogoutBtn']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "logout_button.png"
          priority: 3

  OrdersPage.OrdersWindow.lblConfirmation:
    displayName: "Confirmation Label"
    controlType: "Label"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "verification"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "lblConfirmation"
          priority: 1
        - searchBy: "Name"
          value: "ConfirmationLabel"
          priority: 2
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/Label[@AutomationId='lblConfirmation']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/Label[@AutomationId='lblConfirmation']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='General']/GroupBox[@Name='OrderInfo']/Label[@Name='ConfirmationLabel']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "confirmation_label.png"
          priority: 3

  OrdersPage.OrdersWindow.gridOrders:
    displayName: "Orders Grid"
    controlType: "DataGrid"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "verification"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
