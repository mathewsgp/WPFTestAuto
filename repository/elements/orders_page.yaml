# Element Repository — Orders Page
#
# Hierarchical Element Format with parentAlias
# ============================================
#
# Each element specifies:
# - parentAlias: Parent element alias (or null for root/Window)
# - relativeXPath: XPath relative to parent element
# - strategies: Per-driver strategies with priority
#
# Structure:
# OrdersPage.OrdersWindow (parentAlias: null, window element)
# └── OrdersPage.TabControl (parentAlias: OrdersPage.OrdersWindow)
#     ├── OrdersPage.GeneralTab (parentAlias: OrdersPage.TabControl)
#     │   └── OrdersPage.OrderGroup (parentAlias: OrdersPage.GeneralTab)
#     │       ├── OrdersPage.cmbSku
#     │       ├── OrdersPage.txtQty
#     │       ├── OrdersPage.chkPriority - NO AutomationId
#     │       ├── OrdersPage.btnCreateOrder
#     │       └── OrdersPage.lblConfirmation
#     └── OrdersPage.HistoryTab (parentAlias: OrdersPage.TabControl)
#         └── OrdersPage.gridOrders
#             └── OrdersPage.btnLogout
#
# NOTE: Only include identifiable containers (Window, TabControl, TabItem, GroupBox)
# Layout containers without identifiers are NOT included in the hierarchy.
#
elements:
  # Root window - parent is null (this is the top-level element)
  OrdersPage.OrdersWindow:
    displayName: "Orders Window"
    controlType: "Window"
    windowAutomationId: "OrdersWindow"
    parentAlias: null  # This is the root
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "OrdersWindow"
          priority: 1

  # TabControl - parent is OrdersWindow
  OrdersPage.TabControl:
    displayName: "Main Tab Control"
    controlType: "TabControl"
    automationId: "MainTabs"
    parentAlias: "OrdersPage.OrdersWindow"
    relativeXPath: "TabControl[@AutomationId='MainTabs']"

  # General Tab Item - parent is TabControl
  OrdersPage.GeneralTab:
    displayName: "General Tab"
    controlType: "TabItem"
    name: "General"
    parentAlias: "OrdersPage.TabControl"
    relativeXPath: "TabItem[@Name='General']"

  # Order Info GroupBox - parent is GeneralTab
  OrdersPage.OrderGroup:
    displayName: "Order Info Group"
    controlType: "GroupBox"
    automationId: "OrderInfo"
    parentAlias: "OrdersPage.GeneralTab"
    relativeXPath: "GroupBox[@AutomationId='OrderInfo']"

  # SKU Combo Box - parent is OrderGroup
  OrdersPage.OrdersWindow.cmbSku:
    displayName: "SKU Combo Box"
    controlType: "ComboBox"
    automationId: "cmbSku"
    parentAlias: "OrdersPage.OrderGroup"
    relativeXPath: "ComboBox[@AutomationId='cmbSku']"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "cmbSku"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "ComboBox[@AutomationId='cmbSku']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "sku_combo.png"
          priority: 2

  # Quantity TextBox - parent is OrderGroup
  OrdersPage.OrdersWindow.txtQty:
    displayName: "Quantity Text Box"
    controlType: "TextBox"
    automationId: "txtQty"
    parentAlias: "OrdersPage.OrderGroup"
    relativeXPath: "TextBox[@AutomationId='txtQty']"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "txtQty"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "TextBox[@AutomationId='txtQty']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "qty_box.png"
          priority: 2

  # Priority Checkbox - now UIA-accessible via AutomationPeer
  OrdersPage.OrdersWindow.chkPriority:
    displayName: "Priority Checkbox"
    controlType: "CheckBox"
    automationId: "chkPriority"
    name: "PriorityToggle"
    hasAutomationId: true
    parentAlias: "OrdersPage.OrderGroup"
    relativeXPath: "CheckBox[@AutomationId='chkPriority']"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "chkPriority"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "CheckBox[@AutomationId='chkPriority']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "priority_checkbox.png"
          priority: 2

  # Create Order Button - parent is OrderGroup
  OrdersPage.OrdersWindow.btnCreateOrder:
    displayName: "Create Order Button"
    controlType: "Button"
    automationId: "btnCreateOrder"
    parentAlias: "OrdersPage.OrderGroup"
    relativeXPath: "Button[@AutomationId='btnCreateOrder']"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "btnCreateOrder"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "Button[@AutomationId='btnCreateOrder']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "create_order_button.png"
          priority: 2

  # Confirmation Label - parent is OrderGroup
  OrdersPage.OrdersWindow.lblConfirmation:
    displayName: "Confirmation Label"
    controlType: "Label"
    automationId: "lblConfirmation"
    parentAlias: "OrdersPage.OrderGroup"
    relativeXPath: "Label[@AutomationId='lblConfirmation']"
    defaultTimeout: 10
    tags: ["orders", "verification"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "lblConfirmation"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "Label[@AutomationId='lblConfirmation']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "confirmation_label.png"
          priority: 2

  # History Tab Item - parent is TabControl
  OrdersPage.HistoryTab:
    displayName: "History Tab"
    controlType: "TabItem"
    name: "History"
    parentAlias: "OrdersPage.TabControl"
    relativeXPath: "TabItem[@Name='History']"

  # Orders DataGrid - parent is HistoryTab
  OrdersPage.OrdersWindow.gridOrders:
    displayName: "Orders Grid"
    controlType: "DataGrid"
    automationId: "gridOrders"
    parentAlias: "OrdersPage.HistoryTab"
    relativeXPath: "DataGrid[@AutomationId='gridOrders']"
    defaultTimeout: 10
    tags: ["orders", "verification"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "gridOrders"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "DataGrid[@AutomationId='gridOrders']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "orders_grid.png"
          priority: 2

  # Logout Button - parent is gridOrders
  OrdersPage.OrdersWindow.btnLogout:
    displayName: "Logout Button"
    controlType: "Button"
    automationId: "btnLogout"
    parentAlias: "OrdersPage.OrdersWindow.gridOrders"
    relativeXPath: "Button[@AutomationId='btnLogout']"
    defaultTimeout: 10
    tags: ["orders", "navigation"]
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "btnLogout"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "Button[@AutomationId='btnLogout']"
          priority: 1
      Sikuli:
        - searchBy: "Image"
          value: "logout_button.png"
          priority: 2
