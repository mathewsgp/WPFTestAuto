# Element Repository — Orders Page
#
# Multi-Strategy Format with Hierarchical Support
# ================================================
#
# Structure:
# Window (OrdersWindow)
# └── TabControl (MainTabs)
#     ├── TabItem (General) - Tab 0
#     │   └── GroupBox (OrderInfo)
#     │       ├── ComboBox (cmbSku)
#     │       ├── TextBox (txtQty)
#     │       ├── CheckBox (chkPriority) - NO AutomationId!
#     │       ├── Button (btnCreateOrder)
#     │       └── Label (lblConfirmation)
#     └── TabItem (History) - Tab 1
#         └── DataGrid (gridOrders)
#             └── Button (btnLogout)
#
# NOTE: chkPriority has NO AutomationId - simulates custom control
#
elements:
  OrdersPage.OrdersWindow.cmbSku:
    displayName: "SKU Combo Box"
    controlType: "ComboBox"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "critical"]
    containerPath:
      - {type: "TabControl", automationId: "MainTabs"}
      - {type: "TabItem", name: "General", index: 0}
      - {type: "GroupBox", automationId: "OrderInfo"}
    strategies:
      FlaUI:
        - searchBy: "AutomationId"
          value: "cmbSku"
          priority: 1
        - searchBy: "Name"
          value: "SkuCombo"
          priority: 2
        - searchBy: "TypeAndIndex"
          value: "ComboBox[1]"
          priority: 3
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/ComboBox[@AutomationId='cmbSku']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='General']/GroupBox[@AutomationId='OrderInfo']/ComboBox[@AutomationId='cmbSku']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='General']/GroupBox[@Name='OrderInfo']/ComboBox[@Name='SkuCombo']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "sku_combo.png"
          priority: 3

