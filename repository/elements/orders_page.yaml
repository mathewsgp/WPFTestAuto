        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='History']/DataGrid[@AutomationId='gridOrders']"
          priority: 1
      WPFSpy:
        - searchBy: "XPath"
          value: "/Window[@AutomationId='OrdersWindow']/TabControl[@AutomationId='MainTabs']/TabItem[@Name='History']/DataGrid[@AutomationId='gridOrders']"
          priority: 1
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/TabControl[@Name='MainTabs']/TabItem[@Name='History']/DataGrid[@Name='OrdersGrid']"
          priority: 2
      Sikuli:
        - searchBy: "Image"
          value: "orders_grid.png"
          priority: 3
