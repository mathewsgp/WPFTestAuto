        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/Button[@Name='LogoutBtn']"
          priority: 2
        - searchBy: "XPath"
          value: "/Window[@Name='OrdersWindow']/Button[2]"
          priority: 3
      Sikuli:
        - searchBy: "Image"
          value: "logout_button.png"
          priority: 4

  OrdersPage.OrdersWindow.lblConfirmation:
    displayName: "Confirmation Label"
    controlType: "Label"
    parentWindow: "OrdersWindow"
    defaultTimeout: 10
    tags: ["orders", "verification"]
